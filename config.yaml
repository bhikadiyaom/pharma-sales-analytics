# =============================================================================
# Pharmaceutical Sales & Medicine Demand Analytics - central configuration
# =============================================================================
# Swap datasets by editing the `data:` block only (column names / layout).
# Everything under `assumptions:` is NOT measured in the dataset: the Kaggle
# "Pharma Sales Data" files only contain quantities per ATC class and time.
# Prices, costs, lead times, shelf life ... are illustrative planning
# assumptions that the user can overwrite; they are labelled as such in the app.

project:
  name: Pharmaceutical Sales and Medicine Demand Analytics
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  results_dir: reports/results
  figures_dir: reports/figures
  sqlite_db: data/processed/pharma.db

data:
  is_synthetic: false            # real Kaggle data (see docs/data_dictionary.md)
  layout: wide                   # wide: one column per category | long: date,category,units
  daily_file: salesdaily.csv
  hourly_file: saleshourly.csv
  weekly_file: salesweekly.csv   # used only for a reconciliation check
  monthly_file: salesmonthly.csv # used only for a reconciliation check
  date_col: datum
  date_format: "%m/%d/%Y"        # daily/hourly files; hourly adds " %H:%M"
  hourly_date_format: "%m/%d/%Y %H:%M"
  category_cols: [M01AB, M01AE, N02BA, N02BE, N05B, N05C, R03, R06]
  # long layout only:
  # category_col: category
  # units_col: units
  outlier:
    method: rolling_mad          # robust z-score vs a centred rolling median
    window: 29
    z_threshold: 6.0             # only *extreme* points are capped (winsorised)

categories:                      # descriptive metadata (ATC classification)
  M01AB: "Anti-inflammatory, acetic acid derivatives"
  M01AE: "Anti-inflammatory, propionic acid derivatives"
  N02BA: "Analgesics, salicylic acid derivatives"
  N02BE: "Analgesics, anilides (paracetamol)"
  N05B:  "Psycholeptics, anxiolytics"
  N05C:  "Psycholeptics, hypnotics & sedatives"
  R03:   "Drugs for obstructive airway diseases"
  R06:   "Antihistamines for systemic use"

# ---- ASSUMPTIONS (not in the data) -----------------------------------------
assumptions:
  currency: "INR"
  defaults:
    unit_price: 40.0             # selling price per unit
    unit_cost: 28.0              # purchase cost per unit
    lead_time_days: 5            # supplier lead time
    lead_time_sd_days: 1.0       # supplier lead-time variability
    order_cost: 500.0            # fixed cost per purchase order
    shelf_life_remaining_days: 120   # remaining shelf life of stock on hand
  per_category:                  # overrides of the defaults above
    M01AB: {unit_price: 35.0,  unit_cost: 24.0, lead_time_days: 5}
    M01AE: {unit_price: 55.0,  unit_cost: 38.0, lead_time_days: 6}
    N02BA: {unit_price: 22.0,  unit_cost: 15.0, lead_time_days: 4}
    N02BE: {unit_price: 18.0,  unit_cost: 12.0, lead_time_days: 3}
    N05B:  {unit_price: 60.0,  unit_cost: 42.0, lead_time_days: 7, shelf_life_remaining_days: 150}
    N05C:  {unit_price: 75.0,  unit_cost: 52.0, lead_time_days: 7, shelf_life_remaining_days: 150}
    R03:   {unit_price: 140.0, unit_cost: 98.0, lead_time_days: 8, shelf_life_remaining_days: 100}
    R06:   {unit_price: 30.0,  unit_cost: 20.0, lead_time_days: 4, shelf_life_remaining_days: 100}

calendar:
  # Fixed-date festive flags (MM-DD). The data files do not state the pharmacy's
  # country, so no national holiday package is assumed; add dates here if known.
  fixed_holidays: ["01-01", "12-24", "12-25", "12-26", "12-31"]
  holiday_window_days: 1         # also flag +/- N days around each holiday

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28]

forecasting:
  max_horizon: 90
  horizons: [7, 14, 30, 90]
  models: [naive, snaive, sarimax, prophet, xgboost, lightgbm]
  baseline_model: snaive
  selection_metric: rmse         # mean-unbiased (MAE favours ~0 forecasts on intermittent series)
  cv:                            # rolling-origin (expanding window) evaluation
    horizon: 14
    step: 14                     # contiguous, non-overlapping test windows
    n_folds: 26                  # => last 364 days are out-of-sample
    min_train_days: 730
  interval:
    level: 0.90                  # empirical (CV-residual) prediction intervals
    calibration_horizon: 90
    calibration_origins: 8
    calibration_step: 30
  sarimax:
    order: [1, 0, 1]
    seasonal_order: [1, 1, 1, 7]
    fourier_k: 3                 # yearly seasonality via Fourier terms
    max_train_days: 1095         # fit on trailing 3 years for speed
  gbm:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
  n_jobs: 4

abc_xyz:
  abc_thresholds: [0.80, 0.95]   # cumulative revenue share: A<=80%, B<=95%, C rest
  xyz_cv_thresholds: [0.30, 0.45] # CV of *weekly* demand: X<=a, Y<=b, Z>b
  xyz_aggregation: W

inventory:
  service_levels: [0.90, 0.95, 0.99]
  default_service_level: 0.95
  review_period_days: 14
  holding_rate_annual: 0.20      # holding cost = rate * unit cost per year
  planning_horizon_days: 30      # window for mean forecast demand
  default_days_of_cover: 20      # default stock on hand = cover * mean demand
  overstock_cover_days: 60       # on-hand above this many days of demand => overstock
  price_elasticity: -0.6         # assumed; used only in the what-if simulator
  simulation:
    # Back-test: forecast-driven (s,S) policy vs. moving-average policy
    baseline_window_days: 28

anomaly:
  stl_period: 7
  z_threshold: 5.0           # on Pearson-style robust z (residuals of counts are heavy-tailed)
  contamination: 0.02

clustering:
  k_range: [2, 4]
